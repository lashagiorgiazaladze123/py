<!DOCTYPE html>
<html>
<head>
    <title>Upload Form</title>
</head>
<body>
    <h1>Upload Item</h1>
    <form action="/upload" method="POST">
        <input type="text" name="title" placeholder="Enter item name" required>
        <button type="submit">Upload</button>
    </form>

    <h2>Uploaded Items:</h2>
    <ul>
        {% for item in items %}
            <li>{{ item[1] }}</li>
        {% endfor %}
    </ul>
</body>
</html>
